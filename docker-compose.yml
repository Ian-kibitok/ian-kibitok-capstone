services:
  backend:
    build:
      context: ./backend
    ports:
      - '9001:8000'
    environment:
      - DATABASE_URL=sqlite:///./test.db
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      default:
        aliases:
          - backend-service

  frontend:
    build:
      context: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
