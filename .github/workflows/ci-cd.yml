name: Ian Lagat Capstone CI/CD

on:
  push:
    branches:
      - main
      - feature/project-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  BACKEND_REPOSITORY: ${{ secrets.BACKEND_REPOSITORY }}
  FRONTEND_REPOSITORY: ${{ secrets.FRONTEND_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          if [ -d backend/tests ] && [ "$(ls -A backend/tests)" ]; then
            cd backend && pytest -q
          else
            echo "No backend tests found; skipping."
          fi

  build-and-deploy:
    name: Build and deploy
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: docker build -t backend ./backend

      - name: Tag backend image
        run: |
          docker tag backend:latest \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:latest

      - name: Push backend image
        run: |
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:latest
          docker tag backend:latest ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:${GITHUB_SHA}
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:${GITHUB_SHA}

      - name: Build frontend image
        run: docker build -t frontend ./frontend

      - name: Tag frontend image
        run: |
          docker tag frontend:latest ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:latest
          docker tag frontend:latest ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:${GITHUB_SHA}

      - name: Push frontend image
        run: |
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:latest
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:${GITHUB_SHA}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region ${AWS_REGION} --name ${EKS_CLUSTER_NAME}

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Deploy namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy configmap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Deploy secret
        run: kubectl apply -f k8s/secret.yaml

      - name: Deploy backend
        run: envsubst < k8s/deployment-backend.yaml | kubectl apply -f -

      - name: Deploy backend service
        run: kubectl apply -f k8s/service-backend.yaml

      - name: Deploy frontend
        run: envsubst < k8s/deployment-frontend.yaml | kubectl apply -f -

      - name: Deploy frontend service
        run: kubectl apply -f k8s/service-frontend.yaml

      - name: Deploy ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n ian-lagat --timeout=180s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n ian-lagat --timeout=180s

      - name: Verify deployment
        run: kubectl get all -n ian-lagat
